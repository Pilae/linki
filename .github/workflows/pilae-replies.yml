name: Pilae reply fixtures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test pilae/linkedin-replies/tests/*.test.cjs pilae/contributions/*.test.cjs
      - run: npx tsc --noEmit --incremental false
